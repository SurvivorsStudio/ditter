[project]
name = "eai-connectors"
version = "0.1.0"
description = "EAI 플랫폼 공통 커넥터 라이브러리"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # FastMCP 와 마찬가지로 상위 호환 파손을 막기 위해 상한을 고정한다 (설계 문서 §2 주의사항)
    "sqlalchemy>=2.0.36,<2.1",
    "pymysql>=1.1.1,<1.3",
    "psycopg[binary]>=3.2.3,<3.4",
    "pyodbc>=5.2.0,<6",
    "pymongo>=4.10.1,<5",
    "urllib3>=2.2.3,<3",
    "boto3>=1.35.60,<1.44",
    "pyarrow>=18.0.0,<26",
    # AI 커넥터(Gemini 등)의 REST 호출용. 지연 임포트라 그 커넥터를 만들 때만 로드된다.
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "boto3-stubs[s3]>=1.35.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["**/py.typed"]
packages = ["src/eai_connectors"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# N818: ReadFailed / WriteFailed 처럼 동작의 실패를 나타내는 이름이 호출부에서 더 잘 읽힌다.
# 뿌리 클래스인 ConnectorError 가 Error 접미사 규칙을 지키므로 계층은 명확하다.
"src/eai_connectors/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
# 소스 루트를 알려줘야 패키지 내부 상대 import 를 해석한다
mypy_path = "src"
packages = ["eai_connectors"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "pymysql.*", "pyodbc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# 커버리지는 CI 에서 `--cov` 를 붙일 때만 켠다. `addopts` 에 넣지 않는 이유는 하나다 —
# 테스트 한 파일만 돌릴 때(`pytest tests/test_x.py`) 커버리지는 당연히 떨어지고, 그때
# `fail_under` 가 걸리면 멀쩡한 작업이 실패로 보인다. 게이트는 전체를 돌리는 CI 에만 있다.
[tool.coverage.run]
source = ["src/eai_connectors"]
branch = true

[tool.coverage.report]
# 하한은 실측(59%)보다 조금 낮게 둔다. 내려가면 CI 가 막고, 올라가면 이 숫자를 올린다 —
# 래칫이라 한 방향으로만 움직인다. 목표치가 아니라 **되돌아가지 않기 위한 바닥**이다.
fail_under = 56
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.$",
]
