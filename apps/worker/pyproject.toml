[project]
name = "eai-worker"
version = "0.1.0"
description = "EAI 플랫폼 워커 (Celery) — 수집·변환·적재 실행"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4.0,<5.5",
    "croniter>=6.0.0,<7",
    # CDC Sink Worker 가 Kafka 를 소비한다 (Phase 4c). 순수 파이썬이라 네이티브 빌드가 없다.
    # cdc_sink import 시점이 아니라 KafkaSinkConsumer 인스턴스화 때만 로딩한다.
    "kafka-python>=2.0.2,<4",
    # Python 전처리 노드(transform.python)에서 기본 제공하는 라이브러리. 격리 자식
    # 프로세스가 import 할 수 있도록 시스템 site-packages 에 설치된다 (pysandbox 참조).
    "pandas>=2.2,<4",
    # 메타DB 모델·서비스·DAG 스펙을 API 와 공유한다 (정의 중복 방지)
    "eai-api",
    "eai-connectors",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-croniter>=5.0.0",
]

[tool.uv.sources]
eai-api = { path = "../api", editable = true }
eai-connectors = { path = "../connectors", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["**/py.typed"]
packages = ["src/eai_worker"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
# 소스 루트를 알려줘야 패키지 내부 상대 import 를 해석한다
mypy_path = "src"
packages = ["eai_worker"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["celery.*", "croniter.*", "kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# 커버리지는 CI 에서 `--cov` 를 붙일 때만 켠다. `addopts` 에 넣지 않는 이유는 하나다 —
# 테스트 한 파일만 돌릴 때(`pytest tests/test_x.py`) 커버리지는 당연히 떨어지고, 그때
# `fail_under` 가 걸리면 멀쩡한 작업이 실패로 보인다. 게이트는 전체를 돌리는 CI 에만 있다.
[tool.coverage.run]
source = ["src/eai_worker"]
branch = true

[tool.coverage.report]
# 하한은 실측(54%)보다 조금 낮게 둔다. 내려가면 CI 가 막고, 올라가면 이 숫자를 올린다 —
# 래칫이라 한 방향으로만 움직인다. 목표치가 아니라 **되돌아가지 않기 위한 바닥**이다.
fail_under = 51
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.$",
]
