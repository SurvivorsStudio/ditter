[project]
name = "eai-worker"
version = "0.1.0"
description = "EAI 플랫폼 워커 (Celery) — 수집·변환·적재 실행"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4.0,<5.5",
    "croniter>=6.0.0,<7",
    # CDC Sink Worker 가 Kafka 를 소비한다 (Phase 4c). 순수 파이썬이라 네이티브 빌드가 없다.
    # cdc_sink import 시점이 아니라 KafkaSinkConsumer 인스턴스화 때만 로딩한다.
    "kafka-python>=2.0.2,<3",
    # Python 전처리 노드(transform.python)에서 기본 제공하는 라이브러리. 격리 자식
    # 프로세스가 import 할 수 있도록 시스템 site-packages 에 설치된다 (pysandbox 참조).
    "pandas>=2.2,<4",
    # 메타DB 모델·서비스·DAG 스펙을 API 와 공유한다 (정의 중복 방지)
    "eai-api",
    "eai-connectors",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-croniter>=5.0.0",
]

[tool.uv.sources]
eai-api = { path = "../api", editable = true }
eai-connectors = { path = "../connectors", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["**/py.typed"]
packages = ["src/eai_worker"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
# 소스 루트를 알려줘야 패키지 내부 상대 import 를 해석한다
mypy_path = "src"
packages = ["eai_worker"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["celery.*", "croniter.*", "kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
