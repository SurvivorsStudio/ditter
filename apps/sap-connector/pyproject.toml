[project]
name = "eai-sap-connector"
version = "0.1.0"
description = "SAP RFC 전용 사이드카 — NW RFC SDK 격리 (설계 문서 §2, §3)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.5,<0.142",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.10.2,<3",
    "pydantic-settings>=2.6.1,<3",
]

# pyrfc 는 여기 넣을 수 없다. SAP NW RFC SDK 는 라이선스가 있어야 받을 수 있는
# 독점 바이너리이고, pyrfc 는 그 SDK 가 있어야 빌드된다. Dockerfile 참고.
[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["**/py.typed"]
packages = ["src/eai_sap"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# B008 은 FastAPI 의존성 주입 관용구
"src/eai_sap/main.py" = ["B008"]
# N818: SapCallError 계열은 뿌리인 SapError 가 규칙을 지킨다
"src/eai_sap/backends/base.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["eai_sap"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyrfc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# 커버리지는 CI 에서 `--cov` 를 붙일 때만 켠다. `addopts` 에 넣지 않는 이유는 하나다 —
# 테스트 한 파일만 돌릴 때(`pytest tests/test_x.py`) 커버리지는 당연히 떨어지고, 그때
# `fail_under` 가 걸리면 멀쩡한 작업이 실패로 보인다. 게이트는 전체를 돌리는 CI 에만 있다.
[tool.coverage.run]
source = ["src/eai_sap"]
branch = true

[tool.coverage.report]
# 하한은 실측(79%)보다 조금 낮게 둔다. 내려가면 CI 가 막고, 올라가면 이 숫자를 올린다 —
# 래칫이라 한 방향으로만 움직인다. 목표치가 아니라 **되돌아가지 않기 위한 바닥**이다.
fail_under = 76
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.$",
]
