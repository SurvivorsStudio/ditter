server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Vite 가 파일명에 콘텐츠 해시를 박으므로 정적 자산은 영구 캐시해도 안전하다.
  # (내용이 바뀌면 파일명이 바뀌어 새로 받는다)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # SPA — 알 수 없는 경로는 index.html 로 넘겨 라우터가 처리하게 한다.
  # index.html 은 해시가 없으므로 항상 재검증(no-cache)해야 리빌드가 즉시 반영된다.
  # 안 그러면 브라우저가 옛 HTML 을 물고 옛 자산 해시를 참조해 변경이 안 보인다.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # API 와 WebSocket 을 같은 오리진으로 프록시 → CORS 불필요
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
