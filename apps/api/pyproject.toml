[project]
name = "eai-api"
version = "0.1.0"
description = "EAI 플랫폼 백엔드 (FastMCP + FastAPI)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.5,<0.142",
    "uvicorn[standard]>=0.32.1",
    # FastMCP 는 빠르게 변한다 — 정확한 버전으로 핀 고정한다 (설계 문서 §2 주의사항).
    # 3.4.7 은 fastmcp-slim 을 통해 `mcp>=1.24.0,<2.0` 을 강제한다 — uv 리졸버가 그대로
    # 말해 준다: "fastmcp==3.4.7 depends on fastmcp-slim[client]==3.4.7 ... depends on
    # mcp>=1.24.0,<2.0". 즉 fastmcp 3.x 와 mcp 2.x 는 **따로 올릴 수 없는 짝**이고,
    # mcp 2.x 로 가려면 fastmcp 도 4.0 으로 함께 가야 한다 (추적 이슈 #114).
    # pydantic 호환은 uv.lock 으로 확인했다 — fastmcp 3.4.7 은 `pydantic[email]>=2.11.7`
    # 을 요구하고, 우리 상한(`<3`) 안에서 실제로 풀리는 값은 2.13.x 다. 올릴 때는 이 조합을
    # 다시 확인할 것.
    "fastmcp==3.4.7",
    # mcp 는 fastmcp 가 요구하는 상한(`<2.0`) 안에서 최신으로 둔다. pip 는 상한이 없어
    # 최신(2.x)을 잡아버리는데(uv 와 달리) 그러면 fastmcp 3.4.7 과 충돌하므로, uv.lock 이
    # 검증한 1.x 최신 버전으로 명시 핀 고정한다 — fastmcp 를 올릴 때 이 버전도 함께 확인할 것.
    "mcp==1.29.1",
    "pydantic>=2.10.2,<3",
    "pydantic-settings>=2.6.1,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14.0,<1.20",
    "psycopg[binary]>=3.2.3,<3.4",
    "redis>=5.2.0,<6",
    "celery>=5.4.0,<5.5",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.0,<3",
    "argon2-cffi>=23.1.0,<26",
    "email-validator>=2.2.0,<3",
    # 이기종 연합 조회 엔진. postgres·mysql 확장으로 원격 DB 를 카탈로그로 붙인다
    # (services/duck_service). 확장 ABI 가 마이너 버전마다 갈리므로 상한을 둔다.
    "duckdb>=1.1.0,<2",
    # DuckDB 결과(Arrow) → 파이썬 행 변환. DECIMAL·DATE·LIST·STRUCT 를 정확히 푼다.
    "polars>=1.0.0,<2",
    "eai-connectors",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
]

[tool.uv.sources]
eai-connectors = { path = "../connectors", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["**/py.typed"]
packages = ["src/eai_api"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# B008 은 FastAPI 의 의존성 주입 관용구다 — Depends() 는 반드시 기본값 자리에 와야 한다
"src/eai_api/auth/rbac.py" = ["B008"]
"src/eai_api/routers/*.py" = ["B008"]
# N818: AuthenticationFailed 는 "인증이 실패했다"는 사건을 가리키는 이름이 호출부에서 더 잘 읽힌다
"src/eai_api/services/user_service.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
# 소스 루트를 알려줘야 패키지 내부 상대 import 를 해석한다
mypy_path = "src"
packages = ["eai_api"]
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["fastmcp.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# 커버리지는 CI 에서 `--cov` 를 붙일 때만 켠다. `addopts` 에 넣지 않는 이유는 하나다 —
# 테스트 한 파일만 돌릴 때(`pytest tests/test_x.py`) 커버리지는 당연히 떨어지고, 그때
# `fail_under` 가 걸리면 멀쩡한 작업이 실패로 보인다. 게이트는 전체를 돌리는 CI 에만 있다.
[tool.coverage.run]
source = ["src/eai_api"]
branch = true

[tool.coverage.report]
# 하한은 실측(53%)보다 조금 낮게 둔다. 내려가면 CI 가 막고, 올라가면 이 숫자를 올린다 —
# 래칫이라 한 방향으로만 움직인다. 목표치가 아니라 **되돌아가지 않기 위한 바닥**이다.
#
# 이 앱만 유독 낮은 이유는 분명하다 — `routers/`·`main.py`·`mcp_server.py`·`cli.py` 가 **0%** 다.
# 테스트 542개가 전부 서비스·스키마 계층을 직접 부르고, HTTP 계층을 지나는 테스트가 하나도
# 없다(`TestClient` 사용처 없음). 측정 대상을 `--cov=eai_api`(임포트된 모듈)로 좁히면 61% 로
# 보이지만 그건 안 세는 파일이 빠진 숫자다. 여기서는 디렉터리를 세어 그 구멍이 보이게 둔다.
fail_under = 50
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.$",
]
