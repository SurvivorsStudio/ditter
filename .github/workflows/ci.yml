name: CI

on:
  push:
    branches: [main]
  pull_request:

# 기본 토큰 권한을 읽기로 좁힌다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # 액션은 커밋 SHA 로 고정한다. 버전 태그는 나중에 다른 커밋을 가리키도록 옮길 수
      # 있어서, npm 쪽 lockfile 고정(S2)·설치 스크립트 차단(S5) 게이트를 우회하는 경로가
      # 된다. SHA 갱신은 .github/dependabot.yml 의 github-actions 항목이 PR 로 올려준다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # docs/policy/supply-chain-security.md
      # S2 — `npm ci` 만 쓴다 (`npm install` 금지).
      # S5 — postinstall 은 악성코드 주요 침투 경로라 설치 스크립트를 차단한다.
      - name: Install (lockfile 고정 + 설치 스크립트 차단)
        run: npm ci --ignore-scripts

      # S3 — 취약점 스캔 게이트.
      - name: Audit
        run: npm audit --audit-level=high

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # compose 파일이 깨져도 위 게이트는 전부 통과한다. 이미지 빌드까지는 러너 시간이
      # 아까워 하지 않고, 문법·보간·포트 표기(127.0.0.1 바인딩)가 살아 있는지만 확인한다.
      - name: Compose 설정 검증
        run: docker compose config -q
