name: CI

on:
  push:
    branches: [main]
  pull_request:

# 기본 토큰 권한을 읽기로 좁힌다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # docs/policy/supply-chain-security.md
      # S2 — `npm ci` 만 쓴다 (`npm install` 금지).
      # S5 — postinstall 은 악성코드 주요 침투 경로라 설치 스크립트를 차단한다.
      - name: Install (lockfile 고정 + 설치 스크립트 차단)
        run: npm ci --ignore-scripts

      # S3 — 취약점 스캔 게이트.
      - name: Audit
        run: npm audit --audit-level=high

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
