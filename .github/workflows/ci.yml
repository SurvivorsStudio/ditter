name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# mypy(strict)는 아직 게이트가 아니다. src 기준 127건이 남아 있어(대부분 apps/api)
# 지금 넣으면 CI 가 상시 빨갛다. 줄여 나가는 중이며 진행 상황은 이슈에서 추적한다.
#
# 커버리지는 게이트다. 다만 **목표치가 아니라 바닥**이다 — 하한(`fail_under` ·
# vitest `thresholds`)을 실측보다 조금 낮게 두고, 내려가면 막고 올라가면 그 숫자를 올린다.
# 하한을 실측과 같게 두면 무관한 리팩터링이 소수점 때문에 빨개진다.
#
# `uv lock --check` 는 게이트다. `pytest` 는 이걸 못 잡는다 — `uv run` 이 필요하면 알아서
# `uv.lock` 을 다시 맞춰 실행하므로, 커밋된 락이 `pyproject.toml` 과 어긋나 있어도 테스트는
# 초록불이 난다. 드러나는 것은 그 락으로 이미지를 굽는 배포 시점이다. 2026-09-01 주기에
# 실제로 이 조건이 성립했다 — #115 가 `apps/api`·`apps/worker` 의 `uv.lock` 을 고쳐 머지됐고,
# 그보다 먼저 갈라진 #118 이 리베이스되지 않은 채(dependabot 이 충돌 없다고 보고 넘겼다) 같은
# 락의 다른 패키지 블록을 건드려 git 이 텍스트로 자동 병합했다. 결과는 우연히 옳았지만,
# 그것을 확인한 것은 CI 가 아니라 사람이 손으로 돌린 `uv lock --check` 였다 (추적 이슈 #121).
# 네 영역 합쳐 1초 미만이라 비용은 사실상 없다.
#
# 다만 이것이 보는 것은 "락이 pyproject 와 맞는가"이지 "최신 해소인가"가 아니다 —
# 제약을 만족하며 그냥 낡기만 한 락은 통과한다(갱신은 dependabot 몫). 최신을 강제하면
# 업스트림 릴리스마다 변경 없이 CI 가 빨개지므로 일부러 그렇게 두지 않는다.
jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # 단위 테스트용 더미 값 — conftest 가 EAI_AUTH_ENABLED=false 를 기본으로 켜지만,
      # Settings() 가 32바이트 미만 JWT 시크릿을 거부하므로 유효 길이의 더미를 준다.
      EAI_JWT_SECRET: ci-dummy-jwt-secret-0123456789-abcdef
      EAI_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      # ── Python 앱 (uv · pytest) ────────────────────────────────────────
      - name: Install ODBC headers (pyodbc 빌드 의존성)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc-dev

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Check uv.lock (connectors)
        run: cd apps/connectors && uv lock --check

      - name: Test connectors
        run: cd apps/connectors && uv run --extra dev pytest -q --cov --cov-report=term-missing:skip-covered

      - name: Lint connectors (ruff)
        run: cd apps/connectors && uv run --extra dev ruff check .

      - name: Check uv.lock (sap-connector)
        run: cd apps/sap-connector && uv lock --check

      - name: Test sap-connector
        run: cd apps/sap-connector && uv run --extra dev pytest -q --cov --cov-report=term-missing:skip-covered

      - name: Lint sap-connector (ruff)
        run: cd apps/sap-connector && uv run --extra dev ruff check .

      - name: Check uv.lock (api)
        run: cd apps/api && uv lock --check

      - name: Test api
        run: cd apps/api && uv run --extra dev pytest -q --cov --cov-report=term-missing:skip-covered

      - name: Lint api (ruff)
        run: cd apps/api && uv run --extra dev ruff check .

      - name: Check uv.lock (worker)
        run: cd apps/worker && uv lock --check

      - name: Test worker
        run: cd apps/worker && uv run --extra dev pytest -q --cov --cov-report=term-missing:skip-covered

      - name: Lint worker (ruff)
        run: cd apps/worker && uv run --extra dev ruff check .

      # ── Web (npm · vitest) ─────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Test web
        run: cd apps/web && npm ci && npm run test:coverage

      - name: Lint web (eslint)
        run: cd apps/web && npm run lint

      # tsc -b 로 타입까지 본다 — 테스트만으로는 타입 오류가 드러나지 않는다.
      - name: Build web (tsc + vite)
        run: cd apps/web && npm run build
